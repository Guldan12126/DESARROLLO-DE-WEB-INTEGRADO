<header class="main-header">
  <div class="header-actions">
    <button class="notifications-btn" title="Rol actual">
      <i class="fas fa-bell"></i>
      <span class="badge">{{ rolUsuario }}</span>
    </button>

    <div class="user-profile-container">
      <div class="user-profile" (click)="toggleDropdown()">
        <div class="avatar-wrapper">
          <img [src]="avatarUrl" 
               alt="Avatar Usuario" 
               class="user-avatar" 
               (error)="handleImageError($event)">
        </div>
        <span class="user-name">{{ nombreUsuario }}</span>
        <i class="fas fa-chevron-down chevron-icon" [class.rotated]="isDropdownOpen"></i>
      </div>

      @if (isDropdownOpen) {
        <div class="dropdown-menu">
          <a class="dropdown-item"><i class="fas fa-user-circle"></i> Mi Perfil</a>
          <a class="dropdown-item"><i class="fas fa-cog"></i> Configuración</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item logout" (click)="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
        </div>
      }
    </div>
  </div>
</header>
