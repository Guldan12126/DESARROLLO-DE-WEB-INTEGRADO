<div class="dashboard-container">
  <div class="dashboard-header" style="margin-bottom: 20px;">
    <div class="title-area">
      <h1>Mapa de Mesas 🪑</h1>
      <p class="subtitle">Disponibilidad del salón en tiempo real</p>
    </div>
    <div class="filter-bar">
      <button class="btn-refresh" (click)="cargarMesas()" [disabled]="isLoading"
              style="background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;">
        <i class="fas" [class.fa-sync]="!isLoading" [class.fa-spinner]="isLoading" [class.fa-spin]="isLoading"></i> Actualizar Mapa
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" style="text-align: center; padding: 40px;">
    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: #3498db;"></i>
  </div>

  <div class="charts-grid" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px;" *ngIf="!isLoading">
    
    <div *ngFor="let mesa of mesas" class="chart-card" 
         [ngStyle]="{
           'border-top': '4px solid ' + (mesa.estado === 'DISPONIBLE' ? '#2ecc71' : (mesa.estado === 'OCUPADA' ? '#e74c3c' : '#f39c12')),
           'background': 'white', 'border-radius': '12px', 'box-shadow': '0 4px 10px rgba(0,0,0,0.06)', 'overflow': 'hidden', 'text-align': 'center'
         }">
      <div style="padding: 25px 20px;">
        <h2 style="margin: 0; color: #2c3e50; font-size: 1.8rem; font-weight: 900;">Mesa {{ mesa.numero }}</h2>
        <p style="color: #7f8c8d; font-size: 0.95rem; margin-top: 5px;"><i class="fas fa-users"></i> Capacidad: {{ mesa.capacidad }} pers.</p>
        
        <div style="margin: 20px 0;">
          <span [ngStyle]="{
            'background': mesa.estado === 'DISPONIBLE' ? '#eafaf1' : (mesa.estado === 'OCUPADA' ? '#fdedec' : '#fef9e7'),
            'color': mesa.estado === 'DISPONIBLE' ? '#2ecc71' : (mesa.estado === 'OCUPADA' ? '#e74c3c' : '#f39c12'),
            'border': '1px solid ' + (mesa.estado === 'DISPONIBLE' ? '#2ecc71' : (mesa.estado === 'OCUPADA' ? '#e74c3c' : '#f39c12'))
          }" style="padding: 6px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;">
            {{ mesa.estado }}
          </span>
        </div>

        <button *ngIf="mesa.estado === 'DISPONIBLE'" class="btn" (click)="tomarPedido(mesa.id)"
                style="background: #2ecc71; color: white; width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; transition: background 0.2s;">
          <i class="fas fa-plus-circle"></i> Tomar Pedido
        </button>
        
        <button *ngIf="mesa.estado !== 'DISPONIBLE'" class="btn" disabled
                style="background: #bdc3c7; color: white; width: 100%; padding: 12px; border-radius: 8px; font-weight: 700; border: none; cursor: not-allowed;">
          <i class="fas fa-ban"></i> No Disponible
        </button>
      </div>
    </div>

  </div>
</div>
