<div class="login-wrapper">
<div class="login-container">
  <div class="left-panel">
    <div class="brand-info">
      <img src="favicon.ico" alt="Logo Chifa Xin Yan" class="brand-logo">
      <h1 class="brand-name">Chifa Xin Yan</h1>
      <p class="brand-sub">Auténtico sabor oriental en cada plato</p>
    </div>
  </div>
  
  <div class="right-panel">
    <div class="login-form-container">
      <div class="form-header">
        <i class="fas fa-sign-in-alt"></i>
        <h2>Iniciar Sesión</h2>
        <p>Ingresa tus credenciales</p>
      </div>
      
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Ingrese su correo" required #emailInput="ngModel">
          <small *ngIf="emailInput.invalid && emailInput.touched" class="error-text">El correo es obligatorio</small>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" placeholder="Ingrese su contraseña" required #passInput="ngModel">
            <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" class="toggle-password" (click)="togglePassword()"></i>
          </div>
          <small *ngIf="passInput.invalid && passInput.touched" class="error-text">La contraseña es obligatoria</small>
        </div>
        
        <button type="submit" class="login-button" [disabled]="isLoading">
          <i *ngIf="!isLoading" class="fas fa-sign-in-alt"></i>
          <i *ngIf="isLoading" class="fas fa-circle-notch fa-spin"></i>
          {{ isLoading ? 'Ingresando...' : 'Ingresar' }}
        </button>
        
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      </form>
    </div>
  </div>
</div>
</div>
