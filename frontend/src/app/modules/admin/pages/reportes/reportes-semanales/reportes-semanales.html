<div class="usuarios-container">
  <div class="page-header">
    <div class="header-icon"><i class="fas fa-calendar-week"></i></div>
    <div class="header-text">
      <h2>Reporte de Ventas Semanales</h2>
      <p>Análisis de rendimiento agrupado por semanas (Formato ISO)</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="descargarPdf()">
        <i class="fas fa-file-pdf"></i> Exportar PDF Oficial
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <i class="fas fa-spinner fa-spin fa-3x text-muted"></i>
  </div>

  <div class="user-table-card" *ngIf="!isLoading">
    <div class="table-responsive">
      <table class="xin-yan-table">
        <thead>
          <tr>
            <th>Año - Semana ISO</th>
            <th class="text-center">Volumen de Transacciones</th>
            <th class="text-right">Ingresos Brutos (S/)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="ventasPorSemana.length === 0">
            <td colspan="3" class="text-center">No hay ventas registradas.</td>
          </tr>
          <tr *ngFor="let sem of ventasPorSemana">
            <td class="font-bold"><i class="fas fa-calendar-week text-primary mr-2"></i> Semana {{ sem.week }} del Año {{ sem.year }}</td>
            <td class="text-center"><span class="role-badge role-cajero">{{ sem.cantidad }} tickets</span></td>
            <td class="text-right font-bold text-success">{{ sem.total | currency:'PEN':'S/ ' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
