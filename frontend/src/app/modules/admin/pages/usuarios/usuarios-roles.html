<div class="usuarios-container">
    <div class="page-header">
        <div class="header-icon">
            <i class="fas fa-tags"></i>
        </div>
        <div class="header-text">
            <h2>Roles y Permisos</h2>
            <p>Definición de cargos y niveles de acceso para el personal</p>
        </div>
    </div>

    <div class="user-table-card">
        <div class="table-responsive">
            <table class="xin-yan-table">
                <thead>
                    <tr>
                        <th>Cargo / Rol</th>
                        <th>Descripción de Funciones</th>
                        <th>Módulos Permitidos</th>
                        <th>Acciones</th> <!-- Nueva columna -->
                    </tr>
                </thead>
                <tbody>
                    <tr *ngIf="isLoading">
                        <td colspan="4" class="text-center" style="padding: 2rem; color: #666;">
                            <i class="fas fa-spinner fa-spin"></i> Cargando roles y niveles de acceso...
                        </td>
                    </tr>
                    <tr *ngIf="!isLoading && roles.length === 0">
                        <td colspan="4" class="text-center" style="padding: 2rem; color: #666;">
                            No se encontraron roles definidos en el sistema.
                        </td>
                    </tr>
                    <tr *ngFor="let rol of roles">
                        <td>
                            <span class="role-badge" [ngClass]="rol.colorClass">
                                {{ rol.nombre }}
                            </span>
                        </td>
                        <td style="white-space: normal; min-width: 300px;">
                            {{ rol.descripcion }}
                        </td>
                        <td>
                            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                                <small *ngFor="let p of rol.permisos" style="background: #f1f1f1; padding: 2px 8px; border-radius: 4px; color: #666; font-weight: 600;">
                                    {{ p }}
                                </small>
                            </div>
                        </td>
                        <td class="table-actions">
                            <button class="btn-action btn-edit" (click)="onEditarDescripcion(rol)" [disabled]="isSaving">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
