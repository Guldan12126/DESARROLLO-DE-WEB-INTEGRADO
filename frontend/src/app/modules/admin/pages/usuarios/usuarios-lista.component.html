<div class="usuarios-container">
    <div class="page-header">
        <div class="header-icon">
            <i class="fas fa-users"></i>
        </div>
        <div class="header-text">
            <h2>Gestión de Personal</h2>
            <p>Administre la lista de usuarios y sus roles en el sistema</p>
        </div>
        <div class="header-actions">
            <a routerLink="/admin/usuarios/crear" class="btn-primary">
                <i class="fas fa-user-plus"></i> Nuevo Usuario
            </a>
        </div>
    </div>

    <div class="user-table-card">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" [(ngModel)]="searchTerm" (keyup)="buscarUsuarios()" placeholder="Buscar por nombre, email o rol..." class="search-input">
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngIf="isLoading">
                        <td colspan="5" class="text-center">Cargando usuarios...</td>
                    </tr>
                    <tr *ngIf="!isLoading && usuarios.length === 0">
                        <td colspan="5" class="text-center">No hay usuarios registrados.</td>
                    </tr>
                    <tr *ngFor="let usuario of usuarios">
                        <td>{{ usuario.id }}</td>
                        <td>{{ usuario.nombre }}</td>
                        <td>{{ usuario.email }}</td>
                        <td>
                            <span class="role-badge" [class.admin]="usuario.rol === 'ADMIN'" [class.mozo]="usuario.rol === 'MOZO'" [class.cajero]="usuario.rol === 'CAJERO'" [class.cocina]="usuario.rol === 'COCINA'">
                                {{ usuario.rol }}
                            </span>
                        </td>
                        <td class="table-actions">
                            <button class="btn-action btn-edit" (click)="abrirEditar(usuario)">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-action btn-delete" (click)="eliminarUsuario(usuario.id)">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal: Editar Usuario -->
    <div class="categoria-modal" *ngIf="showEditModal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="edit-modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
                <h3 style="margin: 0; color: #8b0000;"><i class="fas fa-user-edit"></i> Editar Personal</h3>
                <button class="close-btn" (click)="cerrarEditModal()" style="border: none; background: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
            </div>
            
            <div class="xin-yan-form">
                <div class="form-group">
                    <label><i class="fas fa-id-card"></i> Nombre Completo</label>
                    <input type="text" [(ngModel)]="usuarioEditando.nombre" name="nombre" placeholder="Nombre del trabajador">
                </div>
    
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Correo Electrónico</label>
                    <input type="email" [(ngModel)]="usuarioEditando.email" name="email" placeholder="usuario@salonxinyan.com">
                </div>
    
                <div class="form-group">
                    <label><i class="fas fa-user-tag"></i> Cargo / Rol</label>
                    <select [(ngModel)]="usuarioEditando.rol" name="rol">
                        <option value="ADMIN">ADMINISTRADOR</option>
                        <option value="MOZO">MOZO / ATENCIÓN</option>
                        <option value="COCINA">COCINA</option>
                        <option value="CAJERO">CAJERO</option>
                    </select>
                </div>
    
                <div class="form-actions">
                    <button type="button" class="btn-nuevo" (click)="cerrarEditModal()">
                        Cancelar
                    </button>
                    <button type="button" class="btn-primary" (click)="guardarEdicion()" [disabled]="isLoading">
                        <i class="fas" [class.fa-save]="!isLoading" [class.fa-spinner]="isLoading" [class.fa-spin]="isLoading"></i>
                        <span>{{ isLoading ? 'Guardando...' : 'Guardar Cambios' }}</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Confirmar Eliminación de Usuario -->
    <app-confirm-modal
        [isOpen]="showDeleteModal"
        title="Confirmar Eliminación"
        message="¿Está seguro de que desea eliminar a este usuario? Esta acción no se puede deshacer."
        confirmText="Eliminar Usuario"
        cancelText="Volver"
        (confirm)="confirmarEliminacion()"
        (cancel)="cerrarModal()">
    </app-confirm-modal>
</div>
