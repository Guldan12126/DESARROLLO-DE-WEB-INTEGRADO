<div class="dashboard-container">
  <header class="dashboard-header">
    <h1>Panel de Control <small>Salón Xin Yang</small></h1>
    
    <!-- Barra de Filtros -->
    <div class="filter-bar">
      <div class="filter-group">
        <label>Desde:</label>
        <input type="date" [(ngModel)]="fechaInicio" class="form-control">
      </div>
      <div class="filter-group">
        <label>Hasta:</label>
        <input type="date" [(ngModel)]="fechaFin" class="form-control">
      </div>
      <button class="btn btn-primary" (click)="aplicarFiltro()">
        <i class="fas fa-filter"></i> Filtrar
      </button>
    </div>
  </header>

  <!-- KPIs Section -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="icon-box red"><i class="fas fa-coins"></i></div>
      <div class="info">
        <span class="label">Ventas del Día</span>
        <h2 class="value">S/ {{ stats.totalVentasHoy || 0 | number:'1.2-2' }}</h2>
      </div>
    </div>

    <div class="stat-card">
      <div class="icon-box gold"><i class="fas fa-utensils"></i></div>
      <div class="info">
        <span class="label">Pedidos Activos</span>
        <h2 class="value">{{ stats.pedidosActivos || 0 }}</h2>
      </div>
    </div>

    <div class="stat-card">
      <div class="icon-box warning"><i class="fas fa-exclamation-triangle"></i></div>
      <div class="info">
        <span class="label">Stock Bajo</span>
        <h2 class="value">{{ stats.productosStockBajo || 0 }}</h2>
      </div>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="charts-grid">
    <div class="chart-card main-chart">
      <div class="chart-header">
        <h3>Rendimiento de Ventas (Últimos 7 días)</h3>
      </div>
      <div class="chart-body"><canvas #salesChart></canvas></div>
    </div>

    <div class="chart-card side-chart">
      <div class="chart-header">
        <h3>Ventas por Categoría</h3>
      </div>
      <div class="chart-body"><canvas #categoryChart></canvas></div>
    </div>
  </div>
</div>
